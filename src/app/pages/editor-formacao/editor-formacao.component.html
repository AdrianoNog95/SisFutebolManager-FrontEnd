<div class="editor-container">
  <h3>Editor de Formação (uso interno)</h3>
  <p class="text-muted">Arraste os cards. As coordenadas atualizam abaixo.</p>

  <div class="campo-editor">
    <div
      *ngFor="let pos of posicoes"
      class="card-anchor"
      [style.top]="pos.top"
      [style.left]="pos.left">

      <div
        cdkDrag
        [cdkDragFreeDragPosition]="freeDragPositions[pos.chave]"
        (cdkDragEnded)="onDragEnded($event, pos)"
        class="card jogador-card card-draggable">

        <img
          src="avatarPlaceHolder.png"
          class="card-img-top"
          alt="Foto placeholder" />

        <div class="card-body p-1 text-center">
          <small class="text-muted">{{ pos.posicao }}</small>
          <input type="text" class="form-control form-control-sm mt-1" disabled />
          <button type="button" class="btn btn-primary btn-sm w-100 mt-1" disabled>
            Selecionar
          </button>
        </div>

      </div>
    </div>
  </div>

  <button class="btn btn-secondary mt-3" (click)="mostrarJson()">
    Mostrar JSON
  </button>
  <button class="btn btn-primary mt-3 ms-2" (click)="copiarJson()">
    Copiar JSON gerado
  </button>
</div>
